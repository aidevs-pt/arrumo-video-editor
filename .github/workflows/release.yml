# Builds, signs and publishes a release. Run it by hand from the Actions tab; only the accounts in
# the RELEASE_ACTORS variable can, and the `release` environment can add required approval.
# Secrets and variables it needs are listed in docs/releasing.md.
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch, minor, major, or an exact version such as 0.2.0"
        required: true
        default: patch
      preview:
        description: "Preview: publish as a pre-release that the updater and the latest download skip"
        type: boolean
        default: false
      resume:
        description: "Finish an existing draft instead of starting a release: its version, such as 0.1.0. Version and Preview are then taken from the draft"
        default: ""
      platforms:
        description: "Platforms to build; with Resume, only the ones that failed"
        type: choice
        options: [all, linux, windows, macos]
        default: all
concurrency: release
permissions:
  contents: write
env:
  CARGO_INCREMENTAL: "0"
jobs:
  prepare:
    if: contains(format(',{0},', vars.RELEASE_ACTORS), format(',{0},', github.actor))
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version || steps.resume.outputs.version }}
      notes: ${{ steps.version.outputs.notes || steps.resume.outputs.notes }}
      preview: ${{ steps.resume.outputs.preview || inputs.preview }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          matrix=$(jq -cn --arg only "$PLATFORMS" '[
            {platform: "linux", os: "ubuntu-22.04", args: ""},
            {platform: "windows", os: "windows-latest", args: "--config windows-signing.json"},
            {platform: "macos", os: "macos-latest", args: "--target universal-apple-darwin --config macos-signing.json"}
          ] | map(select($only == "all" or .platform == $only)) | {include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      # Resuming reuses the draft's tag, notes and pre-release flag, so a failed platform can be
      # rebuilt without a new version.
      - id: resume
        if: inputs.resume != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.resume }}
        run: |
          draft=$(gh release view "v$VERSION" --repo "${{ github.repository }}" --json isDraft,isPrerelease) \
            || { echo "::error::v$VERSION has no release to resume"; exit 1; }
          [ "$(jq .isDraft <<< "$draft")" = true ] || { echo "::error::v$VERSION is already published"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "preview=$(jq .isPrerelease <<< "$draft")" >> "$GITHUB_OUTPUT"
          # The notes the update dialog shows were stored in the draft's update manifest.
          gh release download "v$VERSION" --repo "${{ github.repository }}" --pattern latest.json --dir "$RUNNER_TEMP" || true
          delimiter="EOF_$(openssl rand -hex 8)"
          { echo "notes<<$delimiter"; jq -r '.notes // ""' "$RUNNER_TEMP/latest.json" 2>/dev/null; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      - if: inputs.resume == ''
        uses: actions/checkout@v7
        with:
          path: video-editor
          # The changelog needs the history since the previous release tag.
          fetch-depth: 0
          # "Protect main" exempts this deploy key, so the version bump can be pushed.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - if: inputs.resume == ''
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: version
        if: inputs.resume == ''
        working-directory: video-editor
        run: |
          version=$(node scripts/set-version.mjs "${{ inputs.version }}")
          cargo update --workspace
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The changelog goes into CHANGELOG.md, the release and the update dialog.
          delimiter="EOF_$(openssl rand -hex 8)"
          { echo "notes<<$delimiter"; node scripts/release-notes.mjs "$version" --changelog; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
          git add CHANGELOG.md
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          # The first release can keep the version already in the files. The release build verifies
          # this commit, so CI skips it.
          git diff --quiet HEAD || git commit -am "chore(release): v$version [skip ci]"
          git tag "v$version"
          git push origin HEAD "v$version"
      - name: Draft the release
        if: inputs.resume == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
          PREVIEW: ${{ inputs.preview }}
          WINDOWS_SIGNED: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT != '' && vars.AZURE_ARTIFACT_SIGNING_PROFILE != '' && secrets.AZURE_CLIENT_ID != '' }}
          MACOS_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          title="Arrumo $VERSION"; flags=""
          if [ "$PREVIEW" = true ]; then title="$title (preview)"; flags="--prerelease"; fi
          node video-editor/scripts/unsigned-notes.mjs "$WINDOWS_SIGNED" "$MACOS_SIGNED" > notes.md
          printf '%s\n' "$NOTES" >> notes.md
          gh release create "v$VERSION" --repo "${{ github.repository }}" --draft $flags \
            --notes-file notes.md --title "$title"

  build:
    needs: prepare
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: video-editor
          ref: v${{ needs.prepare.outputs.version }}
      # The default plugins are bundled from their published, digest-checked registry releases.
      # Public repositories need no token; ARRUMO_REPOS_TOKEN is only for private ones.
      - uses: actions/checkout@v7
        with:
          repository: aidevs-pt/arrumo-plugin-registry
          path: plugin-registry
          token: ${{ secrets.ARRUMO_REPOS_TOKEN || github.token }}
      - name: Fetch the default plugins
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ARRUMO_REPOS_TOKEN || github.token }}
        run: |
          # jq on Windows ends lines with CR, which would end up in repository names.
          jq() { command jq "$@" | tr -d '\r'; }
          mkdir -p plugin-releases plugins
          for id in $(jq -r '.plugins[] | select(.default) | .id' plugin-registry/catalog.json); do
            repository=$(jq -r --arg id "$id" '.plugins[] | select(.id == $id) | .repository' plugin-registry/catalog.json)
            url=$(jq -r --arg id "$id" '.plugins[] | select(.id == $id) | (.releases // []) | last | .packageUrl // empty' plugin-registry/catalog.json)
            if [ -z "$url" ]; then echo "::error::$id has no registry release; publish it first"; exit 1; fi
            tag=$(jq -r --arg id "$id" '.plugins[] | select(.id == $id) | .releases | last | .version' plugin-registry/catalog.json)
            gh repo clone "${repository#https://github.com/}" "plugins/$id" -- --depth 1 --branch "v$tag"
            gh release download "v$tag" --repo "${repository#https://github.com/}" --pattern "*.zip" --output "plugin-releases/$id.zip"
          done
      # FFmpeg and ffprobe ship inside the app as arrumo-ffmpeg and arrumo-ffprobe, from the
      # release and checksums pinned in src-tauri/media-tools.txt.
      - name: Fetch the media tools
        shell: bash
        working-directory: video-editor/src-tauri
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS" in
            Linux) asset=linux-x64 triple=x86_64-unknown-linux-gnu exe="" ;;
            Windows) asset=windows-x64 triple=x86_64-pc-windows-msvc exe=.exe ;;
            macOS) asset=macos-universal triple=universal-apple-darwin exe="" ;;
          esac
          release=$(awk '$1 == "release" { print $2 }' media-tools.txt)
          file=$(awk -v a="$asset" '$1 == a { print $2 }' media-tools.txt)
          sha=$(awk -v a="$asset" '$1 == a { print $3 }' media-tools.txt)
          gh release download "$release" --repo aidevs-pt/ffmpeg-builds --pattern "$file" --dir "$RUNNER_TEMP"
          echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c - 2>/dev/null || echo "$sha  $RUNNER_TEMP/$file" | shasum -a 256 -c -
          mkdir -p binaries media-tools
          unzip -q "$RUNNER_TEMP/$file" -d media-tools
          for tool in ffmpeg ffprobe; do
            mv "media-tools/$tool$exe" "binaries/arrumo-$tool-$triple$exe"
            chmod +x "binaries/arrumo-$tool-$triple$exe"
            # A universal build compiles each architecture on its own, and each looks for its own
            # copy. The universal binary runs on both.
            if [ "$RUNNER_OS" = macOS ]; then
              for arch in aarch64 x86_64; do
                cp "binaries/arrumo-$tool-$triple" "binaries/arrumo-$tool-$arch-apple-darwin"
              done
            fi
          done
          jq -n '{bundle: {externalBin: ["binaries/arrumo-ffmpeg", "binaries/arrumo-ffprobe"],
            resources: {"media-tools/": "media-tools/"}}}' > ../media-tools.json
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: video-editor/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: video-editor/pnpm-lock.yaml
      # Inside the checkout, so the targets go to the toolchain that rust-toolchain.toml pins.
      - if: runner.os == 'macOS'
        working-directory: video-editor
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - working-directory: video-editor
        run: pnpm install --frozen-lockfile
      # Windows installers are signed with Azure Artifact Signing when its account is configured;
      # without it the build is unsigned and SmartScreen warns on first install.
      - name: Prepare Windows signing
        if: runner.os == 'Windows'
        shell: bash
        working-directory: video-editor
        env:
          ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          # Signing needs the account, its certificate profile and the app registration's login.
          if [ -z "$ACCOUNT" ] || [ -z "$PROFILE" ] || [ -z "$CLIENT_ID" ]; then
            echo '{}' > windows-signing.json
            exit 0
          fi
          cargo install --locked artifact-signing-cli@0.12.0
          jq -n --arg e "$ENDPOINT" --arg a "$ACCOUNT" --arg c "$PROFILE" \
            '{bundle: {windows: {signCommand: {cmd: "artifact-signing-cli",
              args: ["-e", $e, "-a", $a, "-c", $c, "-d", "Arrumo AI Video Editor", "%1"]}}}}' > windows-signing.json
      # Apple variables are only set when the certificate exists, since empty values would make
      # the bundler try to import a certificate. Without one the app gets an ad-hoc signature, so
      # macOS offers "Open Anyway" instead of calling the app damaged.
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        working-directory: video-editor
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo '{"bundle": {"macOS": {"signingIdentity": "-"}}}' > macos-signing.json
            exit 0
          fi
          echo '{}' > macos-signing.json
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value=${!name}
            [ -n "$value" ] || continue
            {
              delimiter="EOF_$(openssl rand -hex 8)"
              echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"
            } >> "$GITHUB_ENV"
          done
      # Signing the update checks the signature against the app's public key, so the config
      # needs the same key the app is built with.
      - name: Set the updater key
        shell: bash
        working-directory: video-editor
        env:
          ARRUMO_UPDATER_PUBKEY: ${{ vars.ARRUMO_UPDATER_PUBKEY }}
        run: |
          if [ -z "$ARRUMO_UPDATER_PUBKEY" ]; then echo "::error::ARRUMO_UPDATER_PUBKEY is not set"; exit 1; fi
          jq -n --arg key "$ARRUMO_UPDATER_PUBKEY" '{plugins: {updater: {pubkey: $key}}}' > updater-key.json
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARRUMO_PLUGIN_RELEASE_ROOT: ${{ github.workspace }}/plugin-releases
          # Releases must carry the third-party license notices shown in Settings › About.
          ARRUMO_REQUIRE_LICENSES: "1"
          ARRUMO_UPDATER_PUBKEY: ${{ vars.ARRUMO_UPDATER_PUBKEY }}
          ARRUMO_CRASH_DSN: ${{ secrets.ARRUMO_CRASH_DSN }}
          ARRUMO_USAGE_KEY: ${{ secrets.ARRUMO_USAGE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: video-editor
          tagName: v${{ needs.prepare.outputs.version }}
          releaseDraft: true
          # The update dialog shows these notes.
          releaseBody: ${{ needs.prepare.outputs.notes }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config media-tools.json --config updater-key.json --config '{"bundle":{"active":true,"createUpdaterArtifacts":true}}'

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Every way Arrumo can be installed must find its update, or those copies stop updating.
      - name: Check the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ needs.prepare.outputs.version }}" --repo "${{ github.repository }}" --pattern latest.json
          for target in linux-x86_64 linux-x86_64-appimage linux-x86_64-deb linux-x86_64-rpm windows-x86_64 \
            windows-x86_64-nsis windows-x86_64-msi darwin-aarch64 darwin-x86_64; do
            jq -e --arg t "$target" '.platforms[$t].url and .platforms[$t].signature' latest.json >/dev/null \
              || { echo "::error::latest.json has no update for $target"; exit 1; }
          done
      - env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ needs.prepare.outputs.preview }}
        # A preview stays a pre-release, so releases/latest and the updater keep pointing at the
        # last full release.
        run: |
          if [ "$PREVIEW" = true ]; then
            gh release edit "v${{ needs.prepare.outputs.version }}" --repo "${{ github.repository }}" --draft=false --prerelease
          else
            gh release edit "v${{ needs.prepare.outputs.version }}" --repo "${{ github.repository }}" --draft=false --latest
          fi
