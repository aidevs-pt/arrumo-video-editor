# Builds, signs and publishes a release. Run it by hand from the Actions tab; only the accounts in
# the RELEASE_ACTORS variable can, and the `release` environment can add required approval.
# Secrets and variables it needs are listed in docs/releasing.md.
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch, minor, major, or an exact version such as 0.2.0"
        required: true
        default: patch
      preview:
        description: "Preview: publish as a pre-release that the updater and the latest download skip"
        type: boolean
        default: false
concurrency: release
permissions:
  contents: write
env:
  CARGO_INCREMENTAL: "0"
jobs:
  prepare:
    if: contains(format(',{0},', vars.RELEASE_ACTORS), format(',{0},', github.actor))
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: video-editor
          # "Protect main" exempts this deploy key, so the version bump can be pushed.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: version
        working-directory: video-editor
        run: |
          version=$(node scripts/set-version.mjs "${{ inputs.version }}")
          cargo update --workspace
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          # The first release can keep the version already in the files.
          git diff --quiet || git commit -am "chore(release): v$version"
          git tag "v$version"
          git push origin HEAD "v$version"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIEW: ${{ inputs.preview }}
          WINDOWS_SIGNED: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT != '' && vars.AZURE_ARTIFACT_SIGNING_PROFILE != '' && secrets.AZURE_CLIENT_ID != '' }}
          MACOS_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          title="Arrumo $VERSION"; flags=""
          if [ "$PREVIEW" = true ]; then title="$title (preview)"; flags="--prerelease"; fi
          node video-editor/scripts/unsigned-notes.mjs "$WINDOWS_SIGNED" "$MACOS_SIGNED" > notes.md
          gh release create "v$VERSION" --repo "${{ github.repository }}" --draft $flags \
            --generate-notes --notes-file notes.md --title "$title"

  build:
    needs: prepare
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: --config windows-signing.json
          - os: macos-latest
            args: --target universal-apple-darwin --config macos-signing.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: video-editor
          ref: v${{ needs.prepare.outputs.version }}
      # The default plugins are bundled from their published, digest-checked registry releases.
      # Public repositories need no token; ARRUMO_REPOS_TOKEN is only for private ones.
      - uses: actions/checkout@v7
        with:
          repository: aidevs-pt/arrumo-plugin-registry
          path: plugin-registry
          token: ${{ secrets.ARRUMO_REPOS_TOKEN || github.token }}
      - name: Fetch the default plugins
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ARRUMO_REPOS_TOKEN || github.token }}
        run: |
          mkdir -p plugin-releases plugins
          for id in $(jq -r '.plugins[] | select(.default) | .id' plugin-registry/catalog.json); do
            repository=$(jq -r --arg id "$id" '.plugins[] | select(.id == $id) | .repository' plugin-registry/catalog.json)
            url=$(jq -r --arg id "$id" '.plugins[] | select(.id == $id) | (.releases // []) | last | .packageUrl // empty' plugin-registry/catalog.json)
            if [ -z "$url" ]; then echo "::error::$id has no registry release; publish it first"; exit 1; fi
            tag=$(jq -r --arg id "$id" '.plugins[] | select(.id == $id) | .releases | last | .version' plugin-registry/catalog.json)
            gh repo clone "${repository#https://github.com/}" "plugins/$id" -- --depth 1 --branch "v$tag"
            gh release download "v$tag" --repo "${repository#https://github.com/}" --pattern "*.zip" --output "plugin-releases/$id.zip"
          done
      # FFmpeg and ffprobe ship inside the app as arrumo-ffmpeg and arrumo-ffprobe, from the
      # release and checksums pinned in src-tauri/media-tools.txt.
      - name: Fetch the media tools
        shell: bash
        working-directory: video-editor/src-tauri
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS" in
            Linux) asset=linux-x64 triple=x86_64-unknown-linux-gnu exe="" ;;
            Windows) asset=windows-x64 triple=x86_64-pc-windows-msvc exe=.exe ;;
            macOS) asset=macos-universal triple=universal-apple-darwin exe="" ;;
          esac
          release=$(awk '$1 == "release" { print $2 }' media-tools.txt)
          file=$(awk -v a="$asset" '$1 == a { print $2 }' media-tools.txt)
          sha=$(awk -v a="$asset" '$1 == a { print $3 }' media-tools.txt)
          gh release download "$release" --repo aidevs-pt/ffmpeg-builds --pattern "$file" --dir "$RUNNER_TEMP"
          echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c - 2>/dev/null || echo "$sha  $RUNNER_TEMP/$file" | shasum -a 256 -c -
          mkdir -p binaries media-tools
          unzip -q "$RUNNER_TEMP/$file" -d media-tools
          for tool in ffmpeg ffprobe; do
            mv "media-tools/$tool$exe" "binaries/arrumo-$tool-$triple$exe"
            chmod +x "binaries/arrumo-$tool-$triple$exe"
          done
          jq -n '{bundle: {externalBin: ["binaries/arrumo-ffmpeg", "binaries/arrumo-ffprobe"],
            resources: {"media-tools/": "media-tools/"}}}' > ../media-tools.json
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: video-editor/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: video-editor/pnpm-lock.yaml
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - working-directory: video-editor
        run: pnpm install --frozen-lockfile
      # Windows installers are signed with Azure Artifact Signing when its account is configured;
      # without it the build is unsigned and SmartScreen warns on first install.
      - name: Prepare Windows signing
        if: runner.os == 'Windows'
        shell: bash
        working-directory: video-editor
        env:
          ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          # Signing needs the account, its certificate profile and the app registration's login.
          if [ -z "$ACCOUNT" ] || [ -z "$PROFILE" ] || [ -z "$CLIENT_ID" ]; then
            echo '{}' > windows-signing.json
            exit 0
          fi
          cargo install --locked artifact-signing-cli@0.12.0
          jq -n --arg e "$ENDPOINT" --arg a "$ACCOUNT" --arg c "$PROFILE" \
            '{bundle: {windows: {signCommand: {cmd: "artifact-signing-cli",
              args: ["-e", $e, "-a", $a, "-c", $c, "-d", "Arrumo AI Video Editor", "%1"]}}}}' > windows-signing.json
      # Apple variables are only set when the certificate exists, since empty values would make
      # the bundler try to import a certificate. Without one the app gets an ad-hoc signature, so
      # macOS offers "Open Anyway" instead of calling the app damaged.
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        working-directory: video-editor
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo '{"bundle": {"macOS": {"signingIdentity": "-"}}}' > macos-signing.json
            exit 0
          fi
          echo '{}' > macos-signing.json
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value=${!name}
            [ -n "$value" ] || continue
            {
              delimiter="EOF_$(openssl rand -hex 8)"
              echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"
            } >> "$GITHUB_ENV"
          done
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARRUMO_PLUGIN_RELEASE_ROOT: ${{ github.workspace }}/plugin-releases
          ARRUMO_UPDATER_PUBKEY: ${{ vars.ARRUMO_UPDATER_PUBKEY }}
          ARRUMO_CRASH_DSN: ${{ secrets.ARRUMO_CRASH_DSN }}
          ARRUMO_USAGE_KEY: ${{ secrets.ARRUMO_USAGE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: video-editor
          tagName: v${{ needs.prepare.outputs.version }}
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config media-tools.json --config '{"bundle":{"active":true,"createUpdaterArtifacts":true}}'

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ inputs.preview }}
        # A preview stays a pre-release, so releases/latest and the updater keep pointing at the
        # last full release.
        run: |
          if [ "$PREVIEW" = true ]; then
            gh release edit "v${{ needs.prepare.outputs.version }}" --repo "${{ github.repository }}" --draft=false --prerelease
          else
            gh release edit "v${{ needs.prepare.outputs.version }}" --repo "${{ github.repository }}" --draft=false --latest
          fi
