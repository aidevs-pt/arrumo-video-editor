# Builds, signs and publishes a release. Run it by hand from the Actions tab; only the accounts in
# the RELEASE_ACTORS variable can, and the `release` environment can add required approval.
# Secrets and variables it needs are listed in docs/releasing.md.
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch, minor, major, or an exact version such as 0.2.0"
        required: true
        default: patch
      preview:
        description: "Preview: publish as a pre-release that the updater and the latest download skip"
        type: boolean
        default: false
      resume:
        description: "Finish an existing draft instead of starting a release: its version, such as 0.1.0. Version and Preview are then taken from the draft"
        default: ""
      platforms:
        description: "Platforms to build; with Resume, only the ones that failed"
        type: choice
        options: [all, linux, windows, macos]
        default: all
concurrency: release
permissions:
  contents: write
env:
  # Builds don't report to Next.js. The app is a static export, so installs never do.
  NEXT_TELEMETRY_DISABLED: "1"
  CARGO_INCREMENTAL: "0"
jobs:
  prepare:
    if: contains(format(',{0},', vars.RELEASE_ACTORS), format(',{0},', github.actor))
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version || steps.resume.outputs.version }}
      notes: ${{ steps.version.outputs.notes || steps.resume.outputs.notes }}
      preview: ${{ steps.resume.outputs.preview || inputs.preview }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          matrix=$(jq -cn --arg only "$PLATFORMS" '[
            {platform: "linux", os: "ubuntu-22.04", args: ""},
            {platform: "windows", os: "windows-latest", args: "--config windows-signing.json"},
            {platform: "macos", os: "macos-latest", args: "--target universal-apple-darwin --config macos-signing.json --config macos-dmg.json"}
          ] | map(select($only == "all" or .platform == $only)) | {include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      # Resuming reuses the draft's tag, notes and pre-release flag, so a failed platform can be
      # rebuilt without a new version.
      - id: resume
        if: inputs.resume != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.resume }}
        run: |
          draft=$(gh release view "v$VERSION" --repo "${{ github.repository }}" --json isDraft,isPrerelease) \
            || { echo "::error::v$VERSION has no release to resume"; exit 1; }
          [ "$(jq .isDraft <<< "$draft")" = true ] || { echo "::error::v$VERSION is already published"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "preview=$(jq .isPrerelease <<< "$draft")" >> "$GITHUB_OUTPUT"
          # The notes the update dialog shows were stored in the draft's update manifest.
          gh release download "v$VERSION" --repo "${{ github.repository }}" --pattern latest.json --dir "$RUNNER_TEMP" || true
          delimiter="EOF_$(openssl rand -hex 8)"
          { echo "notes<<$delimiter"; jq -r '.notes // ""' "$RUNNER_TEMP/latest.json" 2>/dev/null; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      - if: inputs.resume == ''
        uses: actions/checkout@v7
        with:
          path: video-editor
          # The changelog needs the history since the previous release tag.
          fetch-depth: 0
          # "Protect main" exempts this deploy key, so the version bump can be pushed.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - if: inputs.resume == ''
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: version
        if: inputs.resume == ''
        working-directory: video-editor
        run: |
          version=$(node scripts/set-version.mjs "${{ inputs.version }}")
          cargo update --workspace
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The changelog goes into CHANGELOG.md, the release and the update dialog.
          delimiter="EOF_$(openssl rand -hex 8)"
          { echo "notes<<$delimiter"; node scripts/release-notes.mjs "$version" --changelog; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
          git add CHANGELOG.md
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          # The first release can keep the version already in the files. The release build verifies
          # this commit, so CI skips it.
          git diff --quiet HEAD || git commit -am "chore(release): v$version [skip ci]"
          git tag "v$version"
          git push origin HEAD "v$version"
      - name: Draft the release
        if: inputs.resume == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
          PREVIEW: ${{ inputs.preview }}
          WINDOWS_SIGNED: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT != '' && vars.AZURE_ARTIFACT_SIGNING_PROFILE != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' }}
          MACOS_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          title="Arrumo $VERSION"; flags=""
          if [ "$PREVIEW" = true ]; then title="$title (preview)"; flags="--prerelease"; fi
          node video-editor/scripts/unsigned-notes.mjs "$WINDOWS_SIGNED" "$MACOS_SIGNED" > notes.md
          printf '%s\n' "$NOTES" >> notes.md
          gh release create "v$VERSION" --repo "${{ github.repository }}" --draft $flags \
            --notes-file notes.md --title "$title"

  build:
    needs: prepare
    environment: release
    # id-token lets Windows signing sign in to Azure with a token GitHub issues for this run.
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: video-editor
          ref: v${{ needs.prepare.outputs.version }}
      # The default plugins are bundled from their published, digest-checked registry releases.
      # Public repositories need no token; ARRUMO_REPOS_TOKEN is only for private ones.
      - uses: actions/checkout@v7
        with:
          repository: aidevs-pt/arrumo-plugin-registry
          path: plugin-registry
          token: ${{ secrets.ARRUMO_REPOS_TOKEN || github.token }}
      - name: Fetch the default plugins
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ARRUMO_REPOS_TOKEN || github.token }}
        run: |
          # jq on Windows ends lines with CR, which would end up in repository names.
          jq() { command jq "$@" | tr -d '\r'; }
          mkdir -p plugin-releases plugins
          for id in $(jq -r '.plugins[] | select(.default) | .id' plugin-registry/catalog.json); do
            repository=$(jq -r --arg id "$id" '.plugins[] | select(.id == $id) | .repository' plugin-registry/catalog.json)
            url=$(jq -r --arg id "$id" '.plugins[] | select(.id == $id) | (.releases // []) | last | .packageUrl // empty' plugin-registry/catalog.json)
            if [ -z "$url" ]; then echo "::error::$id has no registry release; publish it first"; exit 1; fi
            tag=$(jq -r --arg id "$id" '.plugins[] | select(.id == $id) | .releases | last | .version' plugin-registry/catalog.json)
            gh repo clone "${repository#https://github.com/}" "plugins/$id" -- --depth 1 --branch "v$tag"
            gh release download "v$tag" --repo "${repository#https://github.com/}" --pattern "*.zip" --output "plugin-releases/$id.zip"
          done
      # FFmpeg and ffprobe ship inside the app as arrumo-ffmpeg and arrumo-ffprobe, from the
      # release and checksums pinned in src-tauri/media-tools.txt.
      - name: Fetch the media tools
        shell: bash
        working-directory: video-editor/src-tauri
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS" in
            Linux) asset=linux-x64 triple=x86_64-unknown-linux-gnu exe="" ;;
            Windows) asset=windows-x64 triple=x86_64-pc-windows-msvc exe=.exe ;;
            macOS) asset=macos-universal triple=universal-apple-darwin exe="" ;;
          esac
          release=$(awk '$1 == "release" { print $2 }' media-tools.txt)
          file=$(awk -v a="$asset" '$1 == a { print $2 }' media-tools.txt)
          sha=$(awk -v a="$asset" '$1 == a { print $3 }' media-tools.txt)
          gh release download "$release" --repo aidevs-pt/ffmpeg-builds --pattern "$file" --dir "$RUNNER_TEMP"
          echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c - 2>/dev/null || echo "$sha  $RUNNER_TEMP/$file" | shasum -a 256 -c -
          mkdir -p binaries media-tools
          unzip -q "$RUNNER_TEMP/$file" -d media-tools
          for tool in ffmpeg ffprobe; do
            mv "media-tools/$tool$exe" "binaries/arrumo-$tool-$triple$exe"
            chmod +x "binaries/arrumo-$tool-$triple$exe"
            # A universal build compiles each architecture on its own, and each looks for its own
            # copy. The universal binary runs on both.
            if [ "$RUNNER_OS" = macOS ]; then
              for arch in aarch64 x86_64; do
                cp "binaries/arrumo-$tool-$triple" "binaries/arrumo-$tool-$arch-apple-darwin"
              done
            fi
          done
          jq -n '{bundle: {externalBin: ["binaries/arrumo-ffmpeg", "binaries/arrumo-ffprobe"],
            resources: {"media-tools/": "media-tools/"}}}' > ../media-tools.json
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: video-editor/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: video-editor/pnpm-lock.yaml
      # Inside the checkout, so the targets go to the toolchain that rust-toolchain.toml pins.
      - if: runner.os == 'macOS'
        working-directory: video-editor
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - working-directory: video-editor
        run: pnpm install --frozen-lockfile
      # Windows installers are signed with Azure Artifact Signing when its account is configured;
      # without it the build is unsigned and SmartScreen warns on first install.
      - name: Prepare Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: video-editor
        env:
          ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          # Signing needs the account, its certificate profile and the app registration that
          # trusts this repository's release environment.
          if (-not $env:ACCOUNT -or -not $env:PROFILE -or -not $env:CLIENT_ID -or -not $env:TENANT_ID) {
            '{}' | Set-Content windows-signing.json
            exit 0
          }
          # Microsoft's signing client for signtool, checked against the version this was tested with.
          $client = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          $package = "$client.nupkg"
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/1.0.151' -OutFile $package
          if ((Get-FileHash $package -Algorithm SHA256).Hash -ne '35375A4BC4E1102DA729FC3D8D9925F774C3BAAE6B8B7FF6398D948CA9AB0D8A') {
            throw 'The Artifact Signing client does not match its expected checksum'
          }
          Expand-Archive $package -DestinationPath $client
          # Only the GitHub token sign-in is tried, so signing never waits on other methods.
          $metadata = Join-Path $client 'metadata.json'
          @{
            Endpoint = $env:ENDPOINT
            CodeSigningAccountName = $env:ACCOUNT
            CertificateProfileName = $env:PROFILE
            ExcludeCredentials = @('EnvironmentCredential', 'ManagedIdentityCredential', 'SharedTokenCacheCredential',
              'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzureCliCredential', 'AzurePowerShellCredential',
              'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
          } | ConvertTo-Json | Set-Content $metadata
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          "ARRUMO_SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "ARRUMO_SIGNING_DLIB=$(Join-Path $client 'bin\x64\Azure.CodeSigning.Dlib.dll')" >> $env:GITHUB_ENV
          "ARRUMO_SIGNING_METADATA=$metadata" >> $env:GITHUB_ENV
          $script = (Resolve-Path scripts/windows-sign.ps1).Path
          @{ bundle = @{ windows = @{ signCommand = @{ cmd = 'powershell'
            args = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $script, '%1') } } } } |
            ConvertTo-Json -Depth 5 | Set-Content windows-signing.json
      # Apple variables are only set when the certificate exists, since empty values would make
      # the bundler try to import a certificate. Without one the app gets an ad-hoc signature, so
      # macOS offers "Open Anyway" instead of calling the app damaged.
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        working-directory: video-editor
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo '{"bundle": {"macOS": {"signingIdentity": "-"}}}' > macos-signing.json
            exit 0
          fi
          echo '{}' > macos-signing.json
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value=${!name}
            [ -n "$value" ] || continue
            {
              delimiter="EOF_$(openssl rand -hex 8)"
              echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"
            } >> "$GITHUB_ENV"
          done
      # Line tables for crash reports: macOS writes them to a dSYM only when debug info is packed;
      # on Linux they would stay inside the shipped binary and double the packages, so Linux keeps
      # function names only.
      - name: Choose where debug info goes
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) echo "CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=packed" >> "$GITHUB_ENV" ;;
            Linux) echo "CARGO_PROFILE_RELEASE_DEBUG=0" >> "$GITHUB_ENV" ;;
          esac
      # Finder shows the 2x background on Retina screens only from a multi-resolution TIFF.
      - name: Prepare the disk image background
        if: runner.os == 'macOS'
        working-directory: video-editor
        run: |
          tiffutil -cathidpicheck src-tauri/dmg/background.png src-tauri/dmg/background@2x.png -out src-tauri/dmg/background.tiff
          echo '{"bundle": {"macOS": {"dmg": {"background": "dmg/background.tiff"}}}}' > macos-dmg.json
      # Signing the update checks the signature against the app's public key, so the config
      # needs the same key the app is built with.
      - name: Set the updater key
        shell: bash
        working-directory: video-editor
        env:
          ARRUMO_UPDATER_PUBKEY: ${{ vars.ARRUMO_UPDATER_PUBKEY }}
        run: |
          if [ -z "$ARRUMO_UPDATER_PUBKEY" ]; then echo "::error::ARRUMO_UPDATER_PUBKEY is not set"; exit 1; fi
          jq -n --arg key "$ARRUMO_UPDATER_PUBKEY" '{plugins: {updater: {pubkey: $key}}}' > updater-key.json
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARRUMO_PLUGIN_RELEASE_ROOT: ${{ github.workspace }}/plugin-releases
          # Releases must carry the third-party license notices shown in Settings › About.
          ARRUMO_REQUIRE_LICENSES: "1"
          ARRUMO_UPDATER_PUBKEY: ${{ vars.ARRUMO_UPDATER_PUBKEY }}
          ARRUMO_CRASH_DSN: ${{ secrets.ARRUMO_CRASH_DSN }}
          ARRUMO_USAGE_KEY: ${{ secrets.ARRUMO_USAGE_KEY }}
          # The frontend build uploads its source maps with these (scripts/sentry-source-maps.mjs).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # With AZURE_FEDERATED_TOKEN_FILE from scripts/windows-sign.ps1, these sign the
          # Windows build in to Azure without a secret.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: video-editor
          tagName: v${{ needs.prepare.outputs.version }}
          releaseDraft: true
          # The update dialog shows these notes.
          releaseBody: ${{ needs.prepare.outputs.notes }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config media-tools.json --config updater-key.json --config '{"bundle":{"active":true,"createUpdaterArtifacts":true}}'
      # Without the app's debug files, crash reports show addresses instead of code locations.
      - name: Upload debug files to the crash reporter
        shell: bash
        working-directory: video-editor
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "Crash reporter upload is not configured; skipping."
            exit 0
          fi
          find target -maxdepth 4 -path '*/release/*' -not -path '*/bundle/*' -not -path '*/deps/*' -not -path '*/build/*' \
            \( -name 'arrumo-desktop' -o -name 'arrumo-desktop.exe' -o -name 'arrumo_desktop.pdb' -o -name 'arrumo-desktop.dSYM' \) \
            > debug-files.txt
          cat debug-files.txt
          # A crash reporter problem must not hold back a signed release.
          if [ ! -s debug-files.txt ]; then
            echo "::warning::No debug files were found to upload"
          elif ! tr '\n' '\0' < debug-files.txt | xargs -0 pnpm dlx @sentry/cli@2.39.1 debug-files upload --wait; then
            echo "::warning::The debug files could not be uploaded to the crash reporter"
          fi
      # Tauri gives the disk image the app's icon; Finder shows Arrumo's install box instead. The
      # disk image is rebuilt, signed again and uploaded over the one Tauri published. A failure
      # leaves Tauri's disk image in the release.
      - name: Give the disk image its volume icon
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: video-editor
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          work=$(mktemp -d)
          hdiutil convert "$dmg" -format UDSP -o "$work/rw.sparseimage"
          read -r _ current _ < <(hdiutil resize -limits "$work/rw.sparseimage" | tail -1)
          hdiutil resize -sectors $((current + 20480)) "$work/rw.sparseimage"
          hdiutil attach "$work/rw.sparseimage" -readwrite -noverify -noautoopen -nobrowse -mountpoint "$work/mnt"
          cp src-tauri/dmg/volume-icon.icns "$work/mnt/.VolumeIcon.icns"
          xcrun SetFile -c icnC "$work/mnt/.VolumeIcon.icns"
          xcrun SetFile -a C "$work/mnt"
          hdiutil detach "$work/mnt"
          final="$work/$(basename "$dmg" | tr ' ' '.')"
          hdiutil convert "$work/rw.sparseimage" -format UDZO -imagekey zlib-level=9 -o "$final"
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            keychain="$work/sign.keychain-db"
            password=$(openssl rand -hex 16)
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            # codesign only finds identities in keychains on the search list.
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$work/certificate.p12"
            security import "$work/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm "$work/certificate.p12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
            security find-identity -v -p codesigning "$keychain"
            codesign --force --timestamp --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$final"
            security delete-keychain "$keychain"
            codesign --verify --strict --verbose=2 "$final"
          fi
          hdiutil verify "$final"
          gh release upload "v$VERSION" "$final" --clobber --repo "${{ github.repository }}"
          cp "$final" "$dmg"
      # A signed build has to open without a Gatekeeper warning, so a bad certificate or a failed
      # notarization stops the release here instead of reaching users.
      - name: Check the macOS signature
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        working-directory: video-editor/target/universal-apple-darwin/release/bundle/macos
        run: |
          app=$(ls -d *.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          for tool in "$app"/Contents/MacOS/arrumo-ff*; do codesign --verify --strict --verbose=2 "$tool"; done
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Every way Arrumo can be installed must find its update, or those copies stop updating.
      - name: Check the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ needs.prepare.outputs.version }}" --repo "${{ github.repository }}" --pattern latest.json
          for target in linux-x86_64 linux-x86_64-appimage linux-x86_64-deb linux-x86_64-rpm windows-x86_64 \
            windows-x86_64-nsis windows-x86_64-msi darwin-aarch64 darwin-x86_64; do
            jq -e --arg t "$target" '.platforms[$t].url and .platforms[$t].signature' latest.json >/dev/null \
              || { echo "::error::latest.json has no update for $target"; exit 1; }
          done
      - env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ needs.prepare.outputs.preview }}
        # A preview stays a pre-release, so releases/latest and the updater keep pointing at the
        # last full release.
        run: |
          if [ "$PREVIEW" = true ]; then
            gh release edit "v${{ needs.prepare.outputs.version }}" --repo "${{ github.repository }}" --draft=false --prerelease
          else
            gh release edit "v${{ needs.prepare.outputs.version }}" --repo "${{ github.repository }}" --draft=false --latest
          fi
      # Tells the crash reporter the release is out: it then marks issues as new or regressed in
      # this version and links the commits that went into it. Events from the app already carry
      # the same name (sentry::release_name!), so this only adds the release's dates and commits.
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}
          fetch-depth: 0
          path: video-editor
      - name: Finalize the release in the crash reporter
        working-directory: video-editor
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "Crash reporter upload is not configured; skipping."
            exit 0
          fi
          release="arrumo-desktop@$VERSION"
          sentry() { npx --yes @sentry/cli@2.39.1 "$@"; }
          # The release is already public, so a crash reporter problem only warns.
          sentry releases new "$release" || echo "::warning::Could not create $release in the crash reporter"
          sentry releases set-commits "$release" --auto --ignore-missing \
            || echo "::warning::Could not link commits to $release (is the GitHub integration set up in Sentry?)"
          sentry releases finalize "$release" || echo "::warning::Could not finalize $release in the crash reporter"
