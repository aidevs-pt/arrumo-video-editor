name: Rust
on:
  push:
    # Pull request branches are verified by their pull request, and tags by the release build.
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  # A newer commit on the same pull request or branch makes an unfinished run pointless: each
  # commit on main contains the ones before it, as when several pull requests merge at once.
  # Runs started by hand are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
jobs:
  gate:
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gate.yml
    with:
      name: rust
  verify:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Each step waits for the gate rather than the job: required checks are named after the
    # matrix, and a skipped matrix job never reports them.
    defaults:
      run:
        shell: bash
        working-directory: video-editor
    steps:
      - if: needs.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          path: video-editor
      # Tests of the bundled plugins need their checkouts beside the editor. While the plugin
      # repositories are private this takes ARRUMO_REPOS_TOKEN; without access the build is
      # core-only and those tests are skipped.
      - if: needs.gate.outputs.run == 'true'
        name: Check out the default plugins
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.ARRUMO_REPOS_TOKEN || github.token }}
        run: |
          # jq on Windows ends lines with CR, which would end up in repository names.
          jq() { command jq "$@" | tr -d '\r'; }
          if ! gh repo clone aidevs-pt/arrumo-plugin-registry plugin-registry -- --depth 1 2>/dev/null; then
            echo "::notice::The plugin repositories are not readable; testing core only."
            echo "ARRUMO_CORE_ONLY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          for id in $(jq -r '.plugins[] | select(.default) | .id' plugin-registry/catalog.json); do
            gh repo clone "aidevs-pt/arrumo-plugin-$id" "plugins/$id" -- --depth 1
          done
      - if: needs.gate.outputs.run == 'true' && (runner.os == 'Linux')
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev ffmpeg
      - if: needs.gate.outputs.run == 'true'
        run: cargo fmt --check
      - if: needs.gate.outputs.run == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - if: needs.gate.outputs.run == 'true'
        run: cargo test --locked

  # Lets the push to main skip this exact tree once its pull request verified it.
  record:
    needs: [gate, verify]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.gate.outputs.tree }}" > tree.txt
      - uses: actions/upload-artifact@v7
        with:
          name: tested-rust-${{ needs.gate.outputs.tree }}
          path: tree.txt
          retention-days: 30
