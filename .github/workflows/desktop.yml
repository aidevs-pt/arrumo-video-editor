name: Desktop
on:
  push:
    # Pull request branches are verified by their pull request, and tags by the release build.
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  # A newer commit on the same pull request or branch makes an unfinished run pointless: each
  # commit on main contains the ones before it, as when several pull requests merge at once.
  # Runs started by hand are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # Builds don't report to Next.js. The app is a static export, so installs never do.
  NEXT_TELEMETRY_DISABLED: "1"
  ARRUMO_CORE_ONLY: "1"
  CARGO_INCREMENTAL: "0"
jobs:
  gate:
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gate.yml
    with:
      name: desktop
  build:
    needs: gate
    name: Desktop on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Each step waits for the gate rather than the job: required checks are named after the
    # matrix, and a skipped matrix job never reports them.
    steps:
      - if: needs.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: needs.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v6
      - if: needs.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - if: needs.gate.outputs.run == 'true' && (runner.os == 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - if: needs.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.gate.outputs.run == 'true'
        run: pnpm build
      - if: needs.gate.outputs.run == 'true'
        run: cargo clippy --locked -p arrumo-desktop --features tauri/custom-protocol -- -D warnings
      - if: needs.gate.outputs.run == 'true'
        run: cargo build --locked -p arrumo-desktop --features tauri/custom-protocol

  # Lets the push to main skip this exact tree once its pull request verified it.
  record:
    needs: [gate, build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.gate.outputs.tree }}" > tree.txt
      - uses: actions/upload-artifact@v7
        with:
          name: tested-desktop-${{ needs.gate.outputs.tree }}
          path: tree.txt
          retention-days: 30
