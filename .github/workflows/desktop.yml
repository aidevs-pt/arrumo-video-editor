name: Desktop
on: [push, pull_request]
permissions:
  contents: read
env:
  ARRUMO_CORE_ONLY: "1"
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: sudo apt-get update
      - run: sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo clippy --locked -p arrumo-desktop -- -D warnings
