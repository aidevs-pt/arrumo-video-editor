name: Desktop
on: [push, pull_request]
permissions:
  contents: read
env:
  ARRUMO_CORE_ONLY: "1"
  CARGO_INCREMENTAL: "0"
jobs:
  build:
    name: Desktop on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo clippy --locked -p arrumo-desktop --features tauri/custom-protocol -- -D warnings
      - run: cargo build --locked -p arrumo-desktop --features tauri/custom-protocol
