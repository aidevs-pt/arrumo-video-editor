[package]
name = "arrumo-desktop"
version = "0.1.6"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["DEVS.AI UNIPESSOAL LDA <hi@aidevs.pt>"]
description = "AI video editor where an agent edits and you approve every step."
homepage = "https://www.aidevs.pt/tools/arrumo"
repository = "https://github.com/aidevs-pt/arrumo-video-editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arrumo-workspaces = { path = "../crates/workspaces" }
base64 = "0.23"
minisign-verify = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
http-range = "0.1.6"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
sentry = "0.49"
tauri-plugin-sentry = "0.9"
tauri-plugin-aptabase = "1.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["time"] }
