[package]
name = "arrumo-desktop"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arrumo-workspaces = { path = "../crates/workspaces" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
http-range = "0.1.6"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
