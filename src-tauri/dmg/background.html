<!doctype html>
<!-- Source of background.png, the macOS disk image background (660 × 440, the window size in tauri.conf.json). Render it with the fonts loaded at 1x over background.png and at 2x over background@2x.png; the macOS release job combines both into a Retina TIFF. The text stays above the bottom 90 points, which Finder's path and status bars can cover. --><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@125,800&family=Atkinson+Hyperlegible+Next:wght@500;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:660px;height:440px;overflow:hidden;background:#f6f7fb}
  svg{display:block}
  .title{font-family:'Anybody';font-stretch:125%;font-weight:800;font-size:25px;fill:#fff}
  .sub{font-family:'Atkinson Hyperlegible Next';font-weight:500;font-size:13px;fill:#dfe4ff}
  .hint{font-family:'Atkinson Hyperlegible Next';font-weight:700;font-size:15px;fill:#1b2150}
  .small{font-family:'Atkinson Hyperlegible Next';font-weight:500;font-size:12px;fill:#5b628a}
</style></head><body>
<svg width="660" height="440" viewBox="0 0 660 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="az" width="84" height="84" patternUnits="userSpaceOnUse" x="-12" y="0">
      <g fill="none" stroke="white" stroke-width="5" opacity=".23">
        <circle cx="0" cy="0" r="24"/><circle cx="84" cy="0" r="24"/><circle cx="0" cy="84" r="24"/><circle cx="84" cy="84" r="24"/>
      </g>
      <g fill="white" opacity=".23">
        <rect x="38" y="20" width="8" height="15" rx="4"/><rect x="38" y="49" width="8" height="15" rx="4"/>
        <rect x="20" y="38" width="15" height="8" rx="4"/><rect x="49" y="38" width="15" height="8" rx="4"/>
      </g>
      <circle cx="42" cy="42" r="4.5" fill="#f2c230"/>
    </pattern>
    <linearGradient id="fadeR" x1="0" x2="1"><stop offset=".45" stop-color="#2337b4"/><stop offset="1" stop-color="#2337b4" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2337b4" stop-opacity=".09"/><stop offset="1" stop-color="#2337b4" stop-opacity="0"/></radialGradient>
    <marker id="head" viewBox="0 0 20 20" refX="7" refY="10" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M3 3 L17 10 L3 17 Z" fill="#2337b4" stroke="#2337b4" stroke-width="3" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="660" height="84" fill="#2337b4"/>
  <rect width="660" height="84" fill="url(#az)"/>
  <rect width="380" height="84" fill="url(#fadeR)"/>
  <text class="title" x="32" y="44">Arrumo</text>
  <text class="sub" x="33" y="66">AI Video Editor</text>
  <rect y="84" width="660" height="4" fill="#f2c230"/>
  <circle cx="180" cy="182" r="96" fill="url(#glow)"/>
  <circle cx="480" cy="182" r="96" fill="url(#glow)"/>
  <path d="M266 180 C 296 140, 350 132, 388 158" fill="none" stroke="#2337b4" stroke-width="6" stroke-linecap="round" marker-end="url(#head)"/>
  <text class="hint" x="330" y="322" text-anchor="middle">Drag Arrumo into Applications to install it</text>
  <text class="small" x="330" y="344" text-anchor="middle">Then open it from Launchpad or your Applications folder.</text>
  <g transform="translate(0 412)">
    <rect width="660" height="28" fill="#eef0fa"/>
    <g fill="#2337b4" opacity=".16"><circle cx="22" cy="14" r="3"/><circle cx="66" cy="14" r="3"/><circle cx="110" cy="14" r="3"/><circle cx="154" cy="14" r="3"/><circle cx="198" cy="14" r="3"/><circle cx="242" cy="14" r="3"/><circle cx="286" cy="14" r="3"/><circle cx="374" cy="14" r="3"/><circle cx="418" cy="14" r="3"/><circle cx="462" cy="14" r="3"/><circle cx="506" cy="14" r="3"/><circle cx="550" cy="14" r="3"/><circle cx="594" cy="14" r="3"/><circle cx="638" cy="14" r="3"/></g>
    <circle cx="330" cy="14" r="4" fill="#f2c230"/>
  </g>
</svg></body></html>
