[package]
name = "arrumo-workspaces"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "multipart"] }
rusqlite = { version = "0.40", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3.27.0"
url = "2"
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[build-dependencies]
serde_json = "1"
