[package]
name = "arrumo-workspaces"
version = "0.1.5"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
regex = "1"
base64 = "0.23"
ttf-parser = "0.25"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "multipart"] }
rusqlite = { version = "0.43", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3.27.0"
tiny_http = "0.12"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zeroize = "1"
wasmtime = { version = "51.0.0", default-features = false, features = ["runtime", "std", "component-model", "cranelift"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.11"
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
wat = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
